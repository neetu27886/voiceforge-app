[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/clone"
  to = "/.netlify/functions/clone"
  status = 200

[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200

[[redirects]]
  from = "/api/voices"
  to = "/.netlify/functions/voices"
  status = 200

[[redirects]]
  from = "/api/voices/:voiceId"
  to = "/.netlify/functions/delete-voice"
  status = 200
